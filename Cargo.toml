[package]
name = "ahu"
version = "0.2.0"
edition = "2024"
description = "The moai-agent command-line interface"
repository = "https://github.com/moai-agent/ahu"
publish = false

[[bin]]
name = "ahu"
path = "src/main.rs"

[lib]
name = "ahu"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
toml = "0.9"
