[package]
name = "ahu"
version = "0.11.0"
edition = "2024"
description = "The moai-agent command-line interface"
repository = "https://github.com/moai-agent/ahu"
license = "MIT"
publish = false
exclude = [".agents/ahu/config.md", ".agents/ahu/lock.md"]

[[bin]]
name = "ahu"
path = "src/main.rs"

[lib]
name = "ahu"
path = "src/lib.rs"

[dependencies]
ahu-host-api = { version = "0.1.0", path = "crates/ahu-host-api" }
ahu-cmux-plugin = { version = "0.1.0", path = "plugins/cmux", optional = true }
tempfile = "3"
dotenvy = "0.15"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
toml = "0.9"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["trace", "gen-tonic-messages"] }
prost = "0.14"
url = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
yaml_serde = "0.10"

[dev-dependencies]
toml = "0.9"

[workspace]
members = ["crates/ahu-host-api", "plugins/cmux"]

[features]
default = ["cmux-plugin"]
cmux-plugin = ["dep:ahu-cmux-plugin"]
