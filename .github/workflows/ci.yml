name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TEST_THREADS: ${{ matrix.os == 'ubuntu-24.04' && '1' || '2' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runner prerequisites
        run: |
          git --version
          python3 -c 'import sys; assert sys.version_info >= (3, 9), "Python 3.9+ required"'
          rustup --version
      - name: Install pinned Rust and components
        # Reads rust-toolchain.toml; fresh runners may fetch tools/dependencies.
        run: rustup toolchain install --no-self-update
      - name: Check canonical repository skills
        run: |
          python3 scripts/check-skills.py
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Check formatting
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Install synthetic harness executables
        run: |
          set -euo pipefail
          stub_dir="${RUNNER_TEMP}/ahu-harnesses"
          mkdir -p "$stub_dir"
          for harness in claude codex agy opencode; do
            cat > "$stub_dir/$harness" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          case "$(basename "$0")" in
            claude) echo '2.1.270' ;;
            codex) echo 'codex-cli 0.155.1' ;;
            agy) echo '1.2.2' ;;
            opencode) echo '1.18.31' ;;
          esac
          SH
            chmod +x "$stub_dir/$harness"
          done
          echo "$stub_dir" >> "$GITHUB_PATH"
      - name: Test with synthetic fixtures
        run: |
          unset AHU_TEST_CMUX XDG_CONFIG_HOME OPENCODE_CONFIG OPENCODE_CONFIG_CONTENT
          cargo test --locked -- --test-threads="$TEST_THREADS"
      # Configured knowledge validation remains a separate maintainer check:
      # install OKF 0.5.0 outside the checkout, then run
      # cargo run --locked -- knowledge lint. CI tests its fixture integration.
      # A required bundle check needs a reviewed, pinned OKF distribution first.

  prose:
    name: Prose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      VALE_VERSION: 3.21.0
      VALE_SHA256: 96997d19a4ca6981673b0d4c5ca7f3ede4a9f97964a96edc29fba9e28a328336
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Vale
        run: |
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/vale"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/vale" vale
          rm "$archive"
          echo "${RUNNER_TEMP}/vale" >> "$GITHUB_PATH"
      - name: Lint documentation prose
        # Downloads the style packages named in .vale.ini.
        run: scripts/lint-prose.sh

  release-boundary:
    name: Release boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and components
        run: rustup toolchain install --no-self-update
      - name: Validate the release package
        run: |
          set -euo pipefail
          cargo package --locked --no-verify
          if cargo package --locked --no-verify --list | grep -Eiq '(^|/)(\.ahu|\.env|.*\.(pem|key|log|trace|dump|sqlite|db)|credentials|secrets)(/|$)'; then
            echo 'Release package contains a private-state or credential-like path' >&2
            exit 1
          fi
      - name: Check local Markdown links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          broken = []
          files = [Path('README.md'), *Path('docs').rglob('*.md'), *Path('.agents').rglob('*.md')]
          for path in files:
              for target in re.findall(r'\[[^]]+\]\(([^)]+)\)', path.read_text()):
                  target = target.split('#', 1)[0]
                  if not target or '://' in target or target.startswith('mailto:'):
                      continue
                  if not (path.parent / target).resolve().exists():
                      broken.append(f'{path}: {target}')
          if broken:
              print('\n'.join(broken))
              raise SystemExit(1)
          print(f'checked {len(files)} Markdown files')

  cmux:
    name: Live cmux (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and components
        run: rustup toolchain install --no-self-update
      - name: Run live cmux plumbing when the runner provides cmux
        run: |
          set -euo pipefail
          if ! command -v cmux >/dev/null 2>&1; then
            echo '::notice::GitHub-hosted macOS runner does not provide cmux; live probe skipped.'
            exit 0
          fi
          cmux --version
          AHU_TEST_CMUX=1 cargo test --locked --test cmux_integration -- --test-threads=1
