# Prose linting for repository documentation. See https://vale.sh/.
#
# Run `vale sync` once to download the style packages into .vale/styles
# (ignored by Git), then `scripts/lint-prose.sh` to check the docs.

StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = Google, Microsoft, write-good, proselint

Vocab = ahu

[*.md]
BasedOnStyles = Vale, Google, Microsoft, write-good, proselint

# House-voice rules this project declines. These encode the Google and
# Microsoft editorial voice rather than a defect, and they conflict both with
# each other and with the formal register of this repository's documentation.
Google.Contractions = NO
Microsoft.Contractions = NO
Google.Passive = NO
Microsoft.Passive = NO
write-good.Passive = NO
Google.Semicolons = NO
Microsoft.Semicolon = NO
write-good.E-Prime = NO
write-good.TooWordy = NO
Microsoft.Adverbs = NO
Microsoft.SentenceLength = NO

# Advisory rules with no specific correction: they ask the author to consult a
# word list or to reconsider punctuation, and cannot be satisfied in the text.
Microsoft.Vocab = NO
Google.Parens = NO

# Both Oxford comma rules match any 'X and Y' that follows a comma anywhere
# earlier in the sentence, so they flag two-item conjunctions as missing list
# punctuation. Genuine three-item lists in these documents carry the comma.
Google.OxfordComma = NO
Microsoft.OxfordComma = NO
