# Release dependency policy; see docs/dependencies.md for review and exceptions.
[graph]
all-features = true
# No target filter: include platform-specific, build and development dependencies.

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
maximum-db-staleness = "P7D"
unused-ignored-advisory = "deny"
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
# Exact versions from the TLS graph. Owner: Orie Steele.
# Re-review on any affected lockfile update and before each release.
# Retain upstream license/notice texts in distributed artifacts.
exceptions = [
    { crate = "aws-lc-rs@=1.18.1", allow = ["ISC"] },
    { crate = "aws-lc-sys@=0.45.0", allow = ["ISC", "BSD-3-Clause"] },
    { crate = "rustls-webpki@=0.103.15", allow = ["ISC"] },
    { crate = "subtle@=2.6.1", allow = ["BSD-3-Clause"] },
    { crate = "untrusted@=0.9.0", allow = ["ISC"] },
    { crate = "webpki-root-certs@=1.0.9", allow = ["CDLA-Permissive-2.0"] },
]
confidence-threshold = 0.95
include-dev = true
include-build = true
unused-license-exception = "deny"

[licenses.private]
# Only unpublished workspace packages (ahu) are exempt; dependencies are checked.
ignore = true

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
highlight = "all"
skip = [
    { crate = "base64@0.22.1", reason = "hyper-util and reqwest 0.13 require incompatible base64 minor versions" },
    { crate = "getrandom@0.4.3", reason = "tempfile's test-only dependency uses 0.4 while OpenTelemetry uses 0.3" },
    { crate = "r-efi@6.0.0", reason = "the two getrandom minor lines require incompatible EFI support versions" },
    { crate = "syn@3.0.5", reason = "current proc-macro dependencies require both incompatible syn major versions" },
    { crate = "winnow@0.7.15", reason = "toml's parser dependencies require incompatible winnow major versions" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
